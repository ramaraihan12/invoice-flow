; Vercel answers 413 by itself above 4.5 MB. The app takes 2 MB, so anything up
; to this size still gets a proper message from the upload form.
upload_max_filesize = 4M
post_max_size = 4M
max_file_uploads = 5
memory_limit = 256M
expose_php = Off

; Counts PHP's own work, not the wait for Gemini, so this is what stops a PDF
; built to keep the parser busy.
max_execution_time = 20

; Active CPU is the budget on Vercel, and the code in an image never changes.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 64
