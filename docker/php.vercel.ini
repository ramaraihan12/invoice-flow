; The demo takes no uploads, so PHP doesn't accept files at all. The route refuses
; them too, this just means the bytes of a refused file never reach the disk. The
; review form is what's left, and it stays far below this.
file_uploads = Off
post_max_size = 1M
memory_limit = 256M
expose_php = Off

; Active CPU is the budget on Vercel, and the code in an image never changes.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 64
